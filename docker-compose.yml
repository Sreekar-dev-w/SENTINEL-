services:
  backend:
    build: .
    environment:
      # The loopback-bound Compose demo is intentionally usable without an
      # identity provider. Set SENTINEL_ENV=production for a trusted deployment.
      SENTINEL_ENV: ${SENTINEL_ENV:-development}
      SENTINEL_STATE_DB: /data/sentinel.sqlite3
      SENTINEL_ZAP_URL: ${SENTINEL_ZAP_URL:-http://127.0.0.1:8080}
      SENTINEL_NMAP_EXECUTABLE: ${SENTINEL_NMAP_EXECUTABLE:-nmap}
      SENTINEL_TESTSSL_EXECUTABLE: ${SENTINEL_TESTSSL_EXECUTABLE:-testssl.sh}
    volumes:
      - sentinel-data:/data
    ports:
      - "${SENTINEL_BIND_HOST:-127.0.0.1}:${SENTINEL_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${SENTINEL_BIND_HOST:-127.0.0.1}:${SENTINEL_FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  sentinel-data:
